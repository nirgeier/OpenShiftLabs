# -----------------------------------------------------------------------------
# GitHub Actions Workflow: Build & Deploy MkDocs → GitHub Pages (gh-pages)
#
# Steps:
#   1. Checkout repo with full history (needed for git-revision-date plugin).
#   2. Checkout .mkdocs-shared submodule (public, uses GH_PAT if set).
#   3. Set up Python 3.11 with pip cache.
#   4. Install dependencies via uv (fast resolver).
#   5. Merge .mkdocs-shared/mkdocs + mkdocs/ → .mkdocs-build/ (overrides dir).
#   6. Build the MkDocs site into mkdocs-site/.
#   7. Publish mkdocs-site/ to the gh-pages branch.
# -----------------------------------------------------------------------------

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout with full history (git-revision-date-localized needs it)
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Initialise submodules (uses GH_PAT for private repos, falls back
      #    to the built-in GITHUB_TOKEN for public ones)
      # -----------------------------------------------------------------------
      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --local --unset-all http.https://github.com/.extraheader || true
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf \
              "https://github.com/"
          fi
          git submodule update --init --recursive

      # -----------------------------------------------------------------------
      # 3. Python + pip cache
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      # -----------------------------------------------------------------------
      # 4. Install MkDocs dependencies (uv is much faster than plain pip)
      # -----------------------------------------------------------------------
      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          if [ -f mkdocs/requirements.txt ]; then
            uv pip install --system -r mkdocs/requirements.txt
          elif [ -f .mkdocs-build/requirements.txt ]; then
            uv pip install --system -r .mkdocs-build/requirements.txt
          elif [ -f .mkdocs-shared/mkdocs/requirements.txt ]; then
            uv pip install --system -r .mkdocs-shared/mkdocs/requirements.txt
          else
            uv pip install --system \
              mkdocs-material \
              mkdocs-awesome-pages-plugin \
              mkdocs-git-committers-plugin-2 \
              mkdocs-git-revision-date-localized-plugin
          fi

      # -----------------------------------------------------------------------
      # 5. Build .mkdocs-build/ by merging shared base + project overrides
      #    (mkdocs.yml references  custom_dir: .mkdocs-build/overrides)
      # -----------------------------------------------------------------------
      - name: Prepare MkDocs build directory
        run: |
          if [ -d .mkdocs-shared/mkdocs ]; then
            rm -rf .mkdocs-build
            mkdir -p .mkdocs-build
            cp -r .mkdocs-shared/mkdocs/. .mkdocs-build/
            [ -d mkdocs ] && cp -rf mkdocs/. .mkdocs-build/
            echo "Merged .mkdocs-shared/mkdocs + mkdocs/ → .mkdocs-build/"
          fi

      # -----------------------------------------------------------------------
      # 6. Configure git identity (needed by git-revision-date plugins)
      # -----------------------------------------------------------------------
      - name: Configure Git identity
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # -----------------------------------------------------------------------
      # 7. Build the MkDocs site
      # -----------------------------------------------------------------------
      - name: Build MkDocs site
        run: mkdocs build --config-file mkdocs.yml --site-dir mkdocs-site

      # -----------------------------------------------------------------------
      # 8. Publish to gh-pages branch
      # -----------------------------------------------------------------------
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./mkdocs-site
          publish_branch: gh-pages
          commit_message: "docs: deploy MkDocs site [skip ci]"

      - name: Deployment summary
        run: |
          echo "✅ Site published to gh-pages branch."
          echo "   URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
